name: GLASS
description: >-
  Glass Imaging (GlassAI) is a Los Altos, California AI imaging company that
  extracts the full image-quality potential from camera hardware by using neural
  networks to reverse lens aberrations and sensor imperfections. Its GlassAI
  Neural ISP is a software image-signal-processing pipeline that boosts camera
  performance up to 10x on edge AI-enabled devices such as smartphones, and its
  co-designed AI-plus-optics approach delivers DSLR-quality imaging from
  size-constrained camera systems. The company is venture-backed by GV, LDV
  Capital, Future Ventures, Abstract Ventures, Ground Up, and Insight Partners.
  Glass Imaging is an on-device computer-vision technology provider and does not
  currently publish a public developer API, SDK, or documentation surface.
